[project]
name = "agent-immune-ci"
version = "0.1.0"
description = "Continuous security improvement for tool-using AI agents (red/blue co-evolving loop)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
