# Reference Pomerium base config. Local Docker mode uses generated-config.yaml.
#
# Pomerium sits as the MCP gateway in front of the tool server. The target agent
# never talks to the tool server directly — every tools/call request passes
# through here first, and Pomerium enforces whatever policy.yaml currently says.
#
# Pomerium hot-reloads route/policy config from file on change (the right choice
# for a single-instance hackathon deployment — avoid the k8s/etcd dynamic-config
# reload-lag path on demo day).

# Generate the runnable local file with:
#
#   python -m pomerium.local_config
#
# The generated config uses insecure local HTTP on 127.0.0.1:18081 and injects
# `allow: accept` so agent-to-tool calls can be tested without OIDC.

# Browser/OIDC authorization is intentionally not configured in local Docker mode.
# If you want an interactive login prompt, replace the generated `allow: accept`
# route with a normal authenticated Pomerium route and configure a real IdP or
# service-account token flow.

# Routes are defined in policy.yaml. In a real single-file Pomerium config you
# would place the `routes:` block here; this repo keeps it in policy.yaml so the
# Blue Agent's tool-policy diffs touch exactly one file.
