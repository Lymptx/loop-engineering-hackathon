# Local real-gateway mode. Brings up Pomerium (MCP gateway) in front of the tool
# server so tool calls traverse the real proxy instead of only pomerium/ppl.py.
#
#   make pomerium-config
#   docker compose -f pomerium/docker-compose.yaml up --build
#   USE_POMERIUM=1 POMERIUM_URL=http://127.0.0.1:18081/mcp python main.py run-round
#
# Pomerium's MCP support is experimental; use the main image unless a current
# released image has the MCP runtime flag you need.

services:
  pomerium:
    image: ${POMERIUM_IMAGE:-pomerium/pomerium:main}
    volumes:
      - ./generated-config.yaml:/pomerium/config.yaml:ro
    ports:
      - "18081:18081"
    command: ["-config", "/pomerium/config.yaml"]
    depends_on:
      - tool-server

  tool-server:
    build:
      context: ..
      dockerfile: infra/tool-server.Dockerfile   # TODO(step 6): add this Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "18080:8080"
    command: ["python", "-m", "sandbox.tool_server"]
