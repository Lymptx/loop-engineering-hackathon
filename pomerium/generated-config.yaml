address: :18081
insecure_server: true
runtime_flags:
  mcp: true
log_level: info
authorize_log_fields:
- request-id
- method
- path
- mcp-method
- mcp-tool
- mcp-tool-parameters
routes:
- from: http://127.0.0.1:18081
  to: http://tool-server:8080
  mcp:
    server: {}
  policy:
    allow:
      and:
      - accept: true
    deny:
      or:
      - mcp_tool:
          is: admin_reset
      - mcp_tool:
          is: issue_refund
      - mcp_tool:
          is: issue_refund_low_value
      - mcp_tool:
          is: issue_refund_high_value
      - mcp_tool:
          is: internal_diagnostics
      - mcp_tool:
          is: export_customer_data
      - mcp_tool:
          is: export_customer_segment
      - mcp_tool:
          is: send_customer_email
      - mcp_tool:
          is: update_shipping_address
      - mcp_tool:
          is: cancel_order
      - mcp_tool:
          is: close_account
      - mcp_tool:
          is: change_risk_score
